    <script>
        (function () {
            var theme = localStorage.getItem("theme") === "dark" ? "dark" : "light";
            document.documentElement.style.colorScheme = theme;
            if (theme === "dark") {
                document.documentElement.classList.add("dark");
            } else {
                document.documentElement.classList.remove("dark");
            }
        })();

    <!-- ═══════════════════════════════════════════════════════
         ANIMATED SPLASH SCREEN — auto-dismisses in ~2.6s
    ═══════════════════════════════════════════════════════ -->
    <div id="splash-screen" aria-hidden="true">
        <!-- Animated background rings -->
        <div class="splash-ring splash-ring-1"></div>
        <div class="splash-ring splash-ring-2"></div>
        <div class="splash-ring splash-ring-3"></div>

        <!-- Center content -->
        <div class="splash-center">
            <!-- Logo with glow -->
            <div class="splash-logo-wrap">
                <div class="splash-logo-glow"></div>
                <img src="img/au_smart_hub.png" class="splash-logo" alt="AU Smart Hub" />
            </div>

            <!-- Brand name -->
            <div class="splash-brand">
                <span class="splash-au">AU</span>
                <span class="splash-smart">Smart</span>
                <span class="splash-hub">Hub</span>
            </div>

            <!-- Tagline -->
            <p class="splash-tagline">Your Academic Companion</p>

            <!-- Loading dots -->
            <div class="splash-dots">
                <span class="splash-dot"></span>
                <span class="splash-dot"></span>
                <span class="splash-dot"></span>
            </div>
        </div>

        <!-- Version badge (dynamic from config.xml) -->
        <div class="splash-version" id="splash-version-badge"></div>
        <script>var _v = document.getElementById('splash-version-badge'); if (_v) _v.textContent = 'v' + (window.APP_VERSION || '1.0.18');</script>
    </div>

    <style>
        /* ═══════════ SPLASH SCREEN STYLES ═══════════ */
        #splash-screen {
            position: fixed;
            inset: 0;
            z-index: 99999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(160deg, #071525 0%, #0d2540 35%, #103654 60%, #1a4a75 100%);
            overflow: hidden;
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        #splash-screen.splash-hide {
            opacity: 0;
            transform: translateY(-18px);
            pointer-events: none;
        }

        /* Animated rings */
        .splash-ring {
            position: absolute;
            border-radius: 50%;
            border: 1.5px solid rgba(81, 165, 212, 0.18);
            animation: splashRingPulse 3s ease-in-out infinite;
        }

        .splash-ring-1 {
            width: 260px;
            height: 260px;
            animation-delay: 0s;
        }

        .splash-ring-2 {
            width: 380px;
            height: 380px;
            animation-delay: 0.4s;
            border-color: rgba(81, 165, 212, 0.10);
        }

        .splash-ring-3 {
            width: 500px;
            height: 500px;
            animation-delay: 0.8s;
            border-color: rgba(81, 165, 212, 0.06);
        }

        @keyframes splashRingPulse {

            0%,
            100% {
                transform: scale(1);
                opacity: 0.6;
            }

            50% {
                transform: scale(1.06);
                opacity: 1;
            }
        }

        /* Center column */
        .splash-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0;
            position: relative;
            z-index: 1;
        }

        /* Logo */
        .splash-logo-wrap {
            position: relative;
            margin-bottom: 28px;
            animation: splashLogoBounce 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s both;
        }

        @keyframes splashLogoBounce {
            from {
                opacity: 0;
                transform: scale(0.4) translateY(30px);
            }

            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .splash-logo {
            width: 90px;
            height: 90px;
            border-radius: 26px;
            object-fit: contain;
            position: relative;
            z-index: 1;
            box-shadow: 0 8px 40px rgba(16, 54, 84, 0.6), 0 0 0 6px rgba(81, 165, 212, 0.12);
        }

        .splash-logo-glow {
            position: absolute;
            inset: -12px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(81, 165, 212, 0.35) 0%, transparent 70%);
            animation: splashGlow 2s ease-in-out infinite alternate;
        }

        @keyframes splashGlow {
            from {
                opacity: 0.5;
                transform: scale(0.9);
            }

            to {
                opacity: 1;
                transform: scale(1.1);
            }
        }

        /* Brand name */
        .splash-brand {
            display: flex;
            align-items: baseline;
            gap: 7px;
            margin-bottom: 10px;
            animation: splashFadeUp 0.6s ease 0.75s both;
        }

        @keyframes splashFadeUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .splash-au {
            font-size: 2.1rem;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: -0.03em;
            line-height: 1;
        }

        .splash-smart {
            font-size: 1.5rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.85);
            letter-spacing: -0.02em;
        }

        .splash-hub {
            font-size: 1.5rem;
            font-weight: 700;
            color: #51A5D4;
            letter-spacing: -0.02em;
        }

        /* Shimmer on "AU" */
        .splash-au {
            background: linear-gradient(90deg, #fff 0%, #51A5D4 40%, #EED2A3 60%, #fff 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: splashFadeUp 0.6s ease 0.75s both, splashShimmer 2.5s linear 1.2s infinite;
        }

        @keyframes splashShimmer {
            from {
                background-position: -100% center;
            }

            to {
                background-position: 200% center;
            }
        }

        /* Tagline */
        .splash-tagline {
            font-size: 0.78rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.45);
            letter-spacing: 0.12em;
            text-transform: uppercase;
            margin-bottom: 32px;
            animation: splashFadeUp 0.5s ease 1.0s both;
        }

        /* Loading dots */
        .splash-dots {
            display: flex;
            gap: 8px;
            animation: splashFadeUp 0.4s ease 1.2s both;
        }

        .splash-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: rgba(81, 165, 212, 0.7);
            animation: splashDotBounce 1.1s ease-in-out infinite;
        }

        .splash-dot:nth-child(1) {
            animation-delay: 0s;
        }

        .splash-dot:nth-child(2) {
            animation-delay: 0.18s;
        }

        .splash-dot:nth-child(3) {
            animation-delay: 0.36s;
        }

        @keyframes splashDotBounce {

            0%,
            80%,
            100% {
                transform: translateY(0);
                opacity: 0.4;
            }

            40% {
                transform: translateY(-8px);
                opacity: 1;
            }
        }

        /* Version badge */
        .splash-version {
            position: absolute;
            bottom: 28px;
            font-size: 0.65rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.25);
            letter-spacing: 0.1em;
            animation: splashFadeUp 0.4s ease 1.3s both;
        }

        /* Light-theme override (if user has light mode) */
        html:not(.dark) #splash-screen {
            background: linear-gradient(160deg, #0d2540 0%, #103654 40%, #1F618D 75%, #2980b9 100%);
        }
    </style>

    <!-- Splash dismiss script — waits for DOM + min 2.6s -->
    <script>
        (function () {
            var SPLASH_MIN = 2600; // minimum display time in ms
            var started = Date.now();
            function dismissSplash() {
                var el = document.getElementById('splash-screen');
                if (!el) return;
                var elapsed = Date.now() - started;
                var delay = Math.max(0, SPLASH_MIN - elapsed);
                setTimeout(function () {
                    el.classList.add('splash-hide');
                    setTimeout(function () { el.remove(); }, 520);
                }, delay);
            }
            // Dismiss when app is ready (cordova deviceready or DOMContentLoaded)
            document.addEventListener('deviceready', dismissSplash, false);
            document.addEventListener('DOMContentLoaded', function () {
                // On web/browser — dismiss after min time
                if (!window.cordova) dismissSplash();
            });
            // Absolute fallback: dismiss after 4s no matter what
            setTimeout(dismissSplash, 4000);
        })();
    </script>
