<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <script>
        (function () {
            var theme = localStorage.getItem("theme") === "dark" ? "dark" : "light";
            document.documentElement.style.colorScheme = theme;
        })();
    </script>
    <title>AU Smart Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="css/output.css" rel="stylesheet">
    <script src="js/chart.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header
        class="sticky top-4 z-50 mx-4 flex items-center justify-between px-5 py-3 rounded-3xl bg-white/60 dark:bg-[#0b1121]/60 backdrop-blur-xl border border-white/50 dark:border-gray-700/50 shadow-xl shadow-blue-900/5 dark:shadow-black/20 transition-all duration-300">

        <!-- Modern Back Button -->
        <div id="backBtnWrapper" class="invisible" onclick="goBack()">
            <button
                class="p-2 -ml-2 rounded-xl bg-black/5 dark:bg-white/5 hover:bg-black/10 dark:hover:bg-white/10 text-gray-800 dark:text-gray-200 transition-all active:scale-95">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M15 18l-6-6 6-6" />
                </svg>
            </button>
        </div>

        <!-- Glowing Brand Title -->
        <div class="flex items-center gap-2">
            <h1 class="text-lg font-extrabold tracking-widest text-transparent">
                AU Smart Hub
            </h1>
        </div>

        <!-- Enhanced Theme Toggle -->
        <div class="flex gap-2 items-center">
            <button id="themeToggle"
                class="p-2 -mr-2 rounded-xl bg-black/5 dark:bg-white/5 hover:bg-black/10 dark:hover:bg-white/10 text-gray-800 dark:text-gray-200 transition-all active:scale-95">
                <svg id="themeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
                </svg>
            </button>
        </div>

    </header>


    <main id="app" class="p-5 max-w-3xl mx-auto pb-20"></main>

    <!-- Professional Footer -->
    <footer class="bottom-0 w-full p-4 backdrop-blur-lg border-t border-gray-200 dark:border-white/10 bg-white/70 dark:bg-black/50 z-20 text-center pb-safe">
        <div class="max-w-3xl mx-auto flex flex-col items-center justify-center gap-1">
            <p class="text-xs text-gray-500 dark:text-gray-400 font-medium">
                AU Smart Hub &nbsp;·&nbsp; v1.0.14
            </p>
        </div>
    </footer>
    <script src="cordova.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
