<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>AU Smart Hub</title>
    <link href="css/output.css" rel="stylesheet">
    <script src="js/chart.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="sticky top-0 z-20 flex items-center justify-between p-4 backdrop-blur-lg shadow-md">
        <div id="backBtnWrapper" class="invisible" onclick="goBack()">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round" class="cursor-pointer hover:opacity-70">
                <path d="M15 18l-6-6 6-6" />
            </svg>
        </div>

        <h1 class="text-xl font-bold tracking-tight">AU Smart Hub</h1>

        <div class="flex gap-2 items-center">
            <button id="themeToggle" class="p-2 rounded-full backdrop-blur-sm">
                <svg id="themeIcon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
                </svg>
            </button>
        </div>
    </header>

    <main id="app" class="p-5 max-w-3xl mx-auto pb-20"></main>

    <!-- Professional Footer -->
    <footer class="bottom-0 w-full p-4 backdrop-blur-lg border-t border-gray-200 dark:border-white/10 bg-white/70 dark:bg-black/50 z-20 text-center pb-safe">
        <div class="max-w-3xl mx-auto flex flex-col items-center justify-center gap-1">
            <p class="text-xs text-gray-500 dark:text-gray-400 font-medium">
                AU Smart Hub<br>Version 1.0.12
            </p> 
        </div>
    </footer>
    <script src="cordova.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
